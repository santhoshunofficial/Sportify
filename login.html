<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sportify - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  overflow-y: auto; /* FIXED: was hidden/clipped, now scrollable */
}

body {
  font-family: 'Rajdhani', sans-serif;
  background: #0a0a0f;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  position: relative;
}

.bg-grid {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,255,68,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,68,0.04) 1px, transparent 1px);
  background-size: 40px 40px;
  animation: gridMove 20s linear infinite;
  pointer-events: none;
  z-index: 0;
}
@keyframes gridMove {
  0% { transform: translateY(0); }
  100% { transform: translateY(40px); }
}

.sports-floats {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}
.float-emoji {
  position: absolute;
  font-size: 36px;
  opacity: 0.07;
  animation: floatUp linear infinite;
}
@keyframes floatUp {
  0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.07; }
  90% { opacity: 0.07; }
  100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
}

.card {
  background: linear-gradient(135deg, #0d1a0d 0%, #0a0a0f 100%);
  border: 1px solid #1a3a1a;
  border-radius: 20px;
  padding: 50px 45px;
  width: 420px;
  max-width: 100%;
  box-shadow: 0 0 60px rgba(0,255,68,0.1), 0 30px 60px rgba(0,0,0,0.5);
  position: relative;
  z-index: 10;
  animation: slideUp 0.6s cubic-bezier(0.4,0,0.2,1);
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.card-logo { text-align: center; margin-bottom: 8px; }
.card-logo .big-icon { font-size: 48px; display: block; margin-bottom: 8px; }
.card-logo h1 {
  font-family: 'Bebas Neue', cursive;
  font-size: 36px;
  color: #00ff44;
  letter-spacing: 4px;
  text-shadow: 0 0 20px rgba(0,255,68,0.4);
}
.card-logo p { color: #556; font-size: 13px; letter-spacing: 1px; margin-top: 4px; }

.divider { border: none; border-top: 1px solid #1a3a1a; margin: 24px 0; }

.field { margin-bottom: 16px; }
.field label {
  display: block;
  color: #00ff44;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 7px;
}
.field input {
  width: 100%;
  background: #0d1a0d;
  border: 1px solid #1a3a1a;
  color: #eee;
  padding: 13px 16px;
  border-radius: 10px;
  font-family: 'Rajdhani', sans-serif;
  font-size: 15px;
  font-weight: 600;
  outline: none;
  transition: all 0.3s;
}
.field input:focus { border-color: #00ff44; box-shadow: 0 0 15px rgba(0,255,68,0.15); }
.field input::placeholder { color: #334; }

.captcha-row { display: flex; gap: 10px; align-items: center; }
.captcha-display {
  background: #0d1a0d;
  border: 1px solid #00ff44;
  color: #00ff44;
  padding: 13px 18px;
  border-radius: 10px;
  font-family: 'Bebas Neue', cursive;
  font-size: 20px;
  letter-spacing: 4px;
  min-width: 110px;
  text-align: center;
  user-select: none;
}
.refresh-btn {
  background: rgba(0,255,68,0.1);
  border: 1px solid #00ff44;
  color: #00ff44;
  width: 44px; height: 44px;
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
  transition: all 0.3s;
  flex-shrink: 0;
}
.refresh-btn:hover { background: #00ff44; color: #0a0a0f; transform: rotate(180deg); }

.error {
  color: #ff4444;
  font-size: 13px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 12px;
  min-height: 18px;
  letter-spacing: 0.5px;
}

.login-btn {
  width: 100%;
  padding: 15px;
  background: linear-gradient(135deg, #00ff44, #00cc36);
  border: none;
  border-radius: 10px;
  color: #0a0a0f;
  font-family: 'Bebas Neue', cursive;
  font-size: 20px;
  letter-spacing: 3px;
  cursor: pointer;
  transition: all 0.3s;
  margin-bottom: 16px;
}
.login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,255,68,0.4); }

.signup-btn {
  width: 100%;
  padding: 13px;
  background: transparent;
  border: 2px solid #00ff44;
  border-radius: 10px;
  color: #00ff44;
  font-family: 'Bebas Neue', cursive;
  font-size: 18px;
  letter-spacing: 3px;
  cursor: pointer;
  transition: all 0.3s;
}
.signup-btn:hover { background: rgba(0,255,68,0.08); transform: translateY(-2px); }

.bottom-text { text-align: center; color: #445; font-size: 12px; margin-top: 20px; letter-spacing: 0.5px; }
.bottom-text a { color: #00ff44; text-decoration: none; }
</style>
</head>
<body>

#sideMenu.open { left: 0; }
.menu-header {
  display: flex; justify-content: space-between; align-items: center;

#closeBtn:hover { transform: rotate(90deg); }

.cat-icon { font-size: 28px; width: 36px; text-align: center; flex-shrink: 0; }
.cat-name { font-family: 'Bebas Neue', cursive; font-size: 18px; letter-spacing: 2px; color: #ddd; display: block; }

</style>
<nav id="sportify-nav">
  <div class="nav-left">
    <button id="ham" onclick="navToggleMenu()">☰</button>

    <li onclick="navGoTo('sportshome.html')">🏠 Home</li>

    <li onclick="navGoTo('contact.html')">Contact</li>
    <li><button id="loginBtn" onclick="navGoTo('login.html')">Login</button></li>
    <li><button id="profileBtn" onclick="navGoTo('profile.html')">👤</button></li>
  </ul>
</nav>
<div id="nav-overlay" onclick="navCloseMenu()"></div>
<div id="sideMenu">
  <div class="menu-header">
    <span class="menu-title">🏆 SPORTS</span>
    <button id="closeBtn" onclick="navCloseMenu()">✕</button>
  </div>
  <div class="cat-item" onclick="navGoTo('indoor.html')"><span class="cat-icon">🏓</span><span class="cat-name">INDOOR SPORTS</span></div>
  <hr class="menu-divider">
  <div class="cat-item" onclick="navGoTo('outdoor.html')"><span class="cat-icon">⚽</span><span class="cat-name">OUTDOOR SPORTS</span></div>
  <hr class="menu-divider">
  <div class="cat-item" onclick="navGoTo('board.html')"><span class="cat-icon">♟</span><span class="cat-name">BOARD GAMES</span></div>

<script>
function navToggleMenu(){document.getElementById('sideMenu').classList.toggle('open');document.getElementById('nav-overlay').classList.toggle('show');}
function navCloseMenu(){document.getElementById('sideMenu').classList.remove('open');document.getElementById('nav-overlay').classList.remove('show');}

function navGoBack(){window.history.back();}

<div class="bg-grid"></div>
<div class="sports-floats" id="floats"></div>

<div class="card">
  <div class="card-logo">
    <span class="big-icon">🏆</span>
    <h1>SPORTIFY</h1>
    <p>YOUR GAME. YOUR GLORY.</p>
  </div>

  <hr class="divider">

  <div id="errorMsg" class="error"></div>

  <div class="field">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="athlete@example.com">
  </div>

  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password">
  </div>

  <div class="field">
    <label>Captcha Verification</label>
    <div class="captcha-row">
      <div class="captcha-display" id="captcha"></div>
      <button class="refresh-btn" onclick="generateCaptcha()" title="Refresh CAPTCHA">↺</button>
      <input type="text" id="captchaInput" placeholder="Enter code" style="flex:1;">
    </div>
  </div>

  <button class="login-btn" onclick="doLogin()">LOGIN →</button>
  <button class="signup-btn" onclick="goSignup()">NEW HERE? SIGN UP FREE</button>

  <div class="bottom-text">
    <a href="#">Forgot Password?</a> &nbsp;·&nbsp; <a href="#">Need Help?</a>
  </div>
</div>

<script>
let currentCaptcha = "";

const emojis = ['⚽','🏀','🏈','⚾','🎾','🏐','🏉','🎱','🏓','🏸','🥊','🥅','🏋️','🚴','🏊','🤸','⛹️','🏇'];
const floatsDiv = document.getElementById('floats');
for (let i = 0; i < 18; i++) {
  const el = document.createElement('div');
  el.className = 'float-emoji';
  el.textContent = emojis[i % emojis.length];
  el.style.left = (Math.random() * 100) + '%';
  el.style.animationDuration = (8 + Math.random() * 12) + 's';
  el.style.animationDelay = (Math.random() * 15) + 's';
  floatsDiv.appendChild(el);
}

function generateCaptcha() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  currentCaptcha = Array.from({length: 6}, () => chars[Math.floor(Math.random() * chars.length)]).join('');
  document.getElementById("captcha").textContent = currentCaptcha;
}
generateCaptcha();

function doLogin() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const captchaInput = document.getElementById("captchaInput").value.trim().toUpperCase();
  const err = document.getElementById("errorMsg");

  err.textContent = "";
  if (!email || !password || !captchaInput) { err.textContent = "All fields are required!"; return; }
  if (!/^[^ ]+@[^ ]+\.[a-z]{2,}$/.test(email)) { err.textContent = "Invalid email address!"; return; }
  if (password.length < 6) { err.textContent = "Password must be 6+ characters!"; return; }
  if (captchaInput !== currentCaptcha) { err.textContent = "Incorrect CAPTCHA — try again!"; generateCaptcha(); return; }

  window.location.href = "sportshome.html";
}

function goSignup() {
  window.location.href = "signup.html";
}
</script>
