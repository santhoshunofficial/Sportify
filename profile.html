<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sportify - Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Rajdhani', sans-serif;
  background: #0a0a0f;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 30px 20px;
}
.bg-grid {
  position: fixed; inset: 0;
  background-image: linear-gradient(rgba(0,255,68,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,68,0.04) 1px, transparent 1px);
  background-size: 40px 40px; pointer-events: none;
}

.card {
  background: linear-gradient(135deg, #0d1a0d, #0a0a0f);
  border: 1px solid #1a3a1a;
  border-radius: 20px;
  padding: 40px 35px;
  width: 100%; max-width: 440px;
  box-shadow: 0 0 60px rgba(0,255,68,0.1);
  position: relative; z-index: 1;
  text-align: center;
  animation: fadeIn 0.5s ease;
}
@keyframes fadeIn { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: none; } }

.avatar {
  width: 90px; height: 90px;
  background: rgba(0,255,68,0.1);
  border: 3px solid #00ff44;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 42px;
  margin: 0 auto 16px;
  box-shadow: 0 0 30px rgba(0,255,68,0.2);
}

.username {
  font-family: 'Bebas Neue', cursive;
  font-size: 28px; color: #fff; letter-spacing: 2px;
}
.user-level {
  display: inline-block;
  background: rgba(0,255,68,0.1);
  color: #00ff44;
  font-size: 11px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  padding: 4px 14px; border-radius: 20px; border: 1px solid #1a3a1a;
  margin: 8px 0 24px;
}

.info-list { text-align: left; margin-bottom: 24px; }
.info-item {
  display: flex; justify-content: space-between; align-items: center;
  background: #0d0d12; border: 1px solid #1a2a1a;
  border-radius: 10px; padding: 13px 16px; margin-bottom: 10px;
  transition: all 0.3s;
}
.info-item:hover { border-color: #2a4a2a; }
.info-label { color: #00ff44; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
.info-val { color: #ccc; font-size: 15px; font-weight: 600; }

.edit-btn {
  width: 100%; padding: 13px;
  background: rgba(0,255,68,0.08);
  border: 2px solid #00ff44;
  color: #00ff44;
  border-radius: 10px;
  font-family: 'Bebas Neue', cursive;
  font-size: 18px; letter-spacing: 2px;
  cursor: pointer; transition: all 0.3s;
  margin-bottom: 10px;
}
.edit-btn:hover { background: rgba(0,255,68,0.18); transform: translateY(-2px); }

.logout-btn {
  width: 100%; padding: 13px;
  background: rgba(255,68,68,0.1);
  border: 2px solid #ff4444;
  color: #ff4444;
  border-radius: 10px;
  font-family: 'Bebas Neue', cursive;
  font-size: 18px; letter-spacing: 2px;
  cursor: pointer; transition: all 0.3s;
}
.logout-btn:hover { background: #ff4444; color: #fff; }

.no-user { color: #556; text-align: center; padding: 40px 20px; }
.no-user h2 { font-family: 'Bebas Neue', cursive; font-size: 28px; color: #fff; margin-bottom: 12px; }
.no-user a { color: #00ff44; text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
<!-- SPORTIFY NAV START -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style id="sportify-nav-css">

/* ===== SPORTIFY NAVBAR ===== */
#sportify-nav {
  position: fixed; top: 0; left: 0; right: 0; height: 70px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px;
  background: linear-gradient(135deg, #0a0a0f 0%, #0d1f0d 100%);
  border-bottom: 2px solid #00ff44;
  box-shadow: 0 4px 30px rgba(0,255,68,0.15);
  z-index: 99999;
  font-family: 'Rajdhani', sans-serif;
}
#sportify-nav .nav-left { display: flex; align-items: center; gap: 16px; }
#sportify-nav #ham {
  background: none; border: 2px solid #00ff44; color: #00ff44;
  font-size: 20px; width: 42px; height: 42px; border-radius: 8px;
  cursor: pointer; transition: all 0.3s;
  display: flex; align-items: center; justify-content: center;
}
#sportify-nav #ham:hover { background: #00ff44; color: #0a0a0f; }
#sportify-nav .logo {
  font-family: 'Bebas Neue', cursive; font-size: 32px; color: #00ff44;
  letter-spacing: 3px; text-shadow: 0 0 20px rgba(0,255,68,0.5); cursor: pointer;
}
#sportify-nav .logo span { color: #fff; }
#sportify-nav .nav-links { display: flex; align-items: center; gap: 6px; list-style: none; }
#sportify-nav .nav-links li {
  color: #aaa; font-size: 13px; font-weight: 600; letter-spacing: 1.5px;
  padding: 8px 14px; border-radius: 6px; cursor: pointer;
  transition: all 0.3s; text-transform: uppercase; white-space: nowrap;
}
#sportify-nav .nav-links li:hover { color: #00ff44; background: rgba(0,255,68,0.08); }
#sportify-nav #loginBtn {
  background: #00ff44; color: #0a0a0f; border: none; padding: 9px 20px;
  border-radius: 6px; font-family: 'Rajdhani', sans-serif; font-weight: 700;
  font-size: 13px; letter-spacing: 1.5px; cursor: pointer; transition: all 0.3s; text-transform: uppercase;
}
#sportify-nav #loginBtn:hover { background: #00cc36; box-shadow: 0 0 20px rgba(0,255,68,0.4); }
#sportify-nav #profileBtn {
  background: rgba(0,255,68,0.1); border: 2px solid #00ff44; color: #00ff44;
  width: 38px; height: 38px; border-radius: 50%; font-size: 18px;
  cursor: pointer; transition: all 0.3s;
}
#sportify-nav #profileBtn:hover { background: #00ff44; color: #0a0a0f; }
#sideMenu {
  position: fixed; top: 70px; left: -320px; width: 280px;
  height: calc(100vh - 70px); background: #0d0d12;
  border-right: 2px solid #00ff44; box-shadow: 6px 0 40px rgba(0,255,68,0.2);
  transition: left 0.4s cubic-bezier(0.4,0,0.2,1); z-index: 99998;
  overflow-y: auto; padding-bottom: 30px;
}
#sideMenu.open { left: 0; }
.menu-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 20px; border-bottom: 1px solid #1a2a1a; margin-bottom: 10px;
}
.menu-title { font-family: 'Bebas Neue', cursive; color: #00ff44; font-size: 20px; letter-spacing: 2px; }
#closeBtn { background: none; border: none; color: #ff4444; font-size: 22px; cursor: pointer; transition: transform 0.3s; }
#closeBtn:hover { transform: rotate(90deg); }
.cat-item {
  display: flex; align-items: center; gap: 16px;
  padding: 18px 22px; cursor: pointer; transition: all 0.25s;
  border-left: 3px solid transparent; margin: 2px 0;
}
.cat-item:hover { background: rgba(0,255,68,0.07); border-left-color: #00ff44; }
.cat-icon { font-size: 28px; width: 36px; text-align: center; flex-shrink: 0; }
.cat-name { font-family: 'Bebas Neue', cursive; font-size: 18px; letter-spacing: 2px; color: #ddd; display: block; }
.cat-item:hover .cat-name { color: #00ff44; }
.menu-divider { border: none; border-top: 1px solid #1a2a1a; margin: 6px 0; }
#nav-overlay {
  display: none; position: fixed; top: 70px; left: 0;
  width: 100%; height: 100%; background: rgba(0,0,0,0.55); z-index: 9998;
}
#nav-overlay.show { display: block; }
body { padding-top: 70px !important; }

</style>
<nav id="sportify-nav">
  <div class="nav-left">
    <button id="ham" onclick="navToggleMenu()">☰</button>
    <div class="logo" onclick="navGoTo('sportshome.html')">SPORT<span>IFY</span></div>
  </div>
  <ul class="nav-links">
    <li onclick="navGoTo('sportshome.html')">🏠 Home</li>
    <li onclick="navGoTo('about.html')">About Us</li>
    <li onclick="navGoTo('contact.html')">Contact</li>
    <li><button id="loginBtn" onclick="navGoTo('login.html')">Login</button></li>
    <li><button id="profileBtn" onclick="navGoTo('profile.html')">👤</button></li>
  </ul>
</nav>
<div id="nav-overlay" onclick="navCloseMenu()"></div>
<div id="sideMenu">
  <div class="menu-header">
    <span class="menu-title">🏆 SPORTS</span>
    <button id="closeBtn" onclick="navCloseMenu()">✕</button>
  </div>
  <div class="cat-item" onclick="navGoTo('indoor.html')"><span class="cat-icon">🏓</span><span class="cat-name">INDOOR SPORTS</span></div>
  <hr class="menu-divider">
  <div class="cat-item" onclick="navGoTo('outdoor.html')"><span class="cat-icon">⚽</span><span class="cat-name">OUTDOOR SPORTS</span></div>
  <hr class="menu-divider">
  <div class="cat-item" onclick="navGoTo('board.html')"><span class="cat-icon">♟</span><span class="cat-name">BOARD GAMES</span></div>
  <hr class="menu-divider">
  <div class="cat-item" onclick="navGoTo('athletics.html')"><span class="cat-icon">🏃</span><span class="cat-name">ATHLETICS</span></div>
  <hr class="menu-divider">
  <div class="cat-item" onclick="navGoTo('esports.html')"><span class="cat-icon">🎮</span><span class="cat-name">E-SPORTS</span></div>
</div>
<script>
function navToggleMenu(){document.getElementById('sideMenu').classList.toggle('open');document.getElementById('nav-overlay').classList.toggle('show');}
function navCloseMenu(){document.getElementById('sideMenu').classList.remove('open');document.getElementById('nav-overlay').classList.remove('show');}
function navGoTo(page){navCloseMenu();window.location.href=page;}
function navGoBack(){window.history.back();}
</script>
<!-- SPORTIFY NAV END -->



<div class="bg-grid"></div>

<div class="card" id="profileCard" style="display:none">
  <div class="avatar">👤</div>
  <div class="username" id="pName"></div>
  <div class="user-level" id="pLevel"></div>

  <div class="info-list">
    <div class="info-item"><span class="info-label">Age</span><span class="info-val" id="pAge"></span></div>
    <div class="info-item"><span class="info-label">Email</span><span class="info-val" id="pEmail"></span></div>
    <div class="info-item"><span class="info-label">Phone</span><span class="info-val" id="pPhone"></span></div>
    <div class="info-item"><span class="info-label">Sports Level</span><span class="info-val" id="pSports"></span></div>
  </div>

  <button class="edit-btn" onclick="openEdit()">✏️ EDIT PROFILE</button>
  <button class="logout-btn" onclick="logout()">🚪 LOGOUT</button>
</div>

<!-- Edit Profile Modal -->
<div id="editModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:99999; align-items:center; justify-content:center; padding:20px;">
  <div style="background:linear-gradient(135deg,#0d1a0d,#0a0a0f); border:1px solid #00ff44; border-radius:20px; padding:36px; width:100%; max-width:420px; box-shadow:0 0 60px rgba(0,255,68,0.2);">
    <h2 style="font-family:'Bebas Neue',cursive; color:#00ff44; font-size:26px; letter-spacing:3px; margin-bottom:6px; text-align:center;">EDIT PROFILE</h2>
    <p style="color:#556; font-size:12px; text-align:center; letter-spacing:1px; margin-bottom:24px;">UPDATE YOUR INFORMATION</p>
    <div id="editError" style="color:#ff4444; font-size:13px; font-weight:700; text-align:center; margin-bottom:10px; min-height:16px;"></div>
    <div style="display:flex; gap:12px; margin-bottom:14px;">
      <div style="flex:1;">
        <label style="display:block; color:#00ff44; font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-bottom:6px;">First Name</label>
        <input type="text" id="eFname" style="width:100%; background:#0d1a0d; border:1px solid #1a3a1a; color:#eee; padding:11px 14px; border-radius:8px; font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:600; outline:none;">
      </div>
      <div style="flex:1;">
        <label style="display:block; color:#00ff44; font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-bottom:6px;">Last Name</label>
        <input type="text" id="eLname" style="width:100%; background:#0d1a0d; border:1px solid #1a3a1a; color:#eee; padding:11px 14px; border-radius:8px; font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:600; outline:none;">
      </div>
    </div>
    <div style="margin-bottom:14px;">
      <label style="display:block; color:#00ff44; font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-bottom:6px;">Phone Number</label>
      <input type="tel" id="ePhone" style="width:100%; background:#0d1a0d; border:1px solid #1a3a1a; color:#eee; padding:11px 14px; border-radius:8px; font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:600; outline:none;">
    </div>
    <div style="margin-bottom:22px;">
      <label style="display:block; color:#00ff44; font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-bottom:6px;">Sports Level</label>
      <select id="eSports" style="width:100%; background:#0d1a0d; border:1px solid #1a3a1a; color:#eee; padding:11px 14px; border-radius:8px; font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:600; outline:none;">
        <option value="">Select level</option>
        <option>Beginner</option>
        <option>Intermediate</option>
        <option>State Level</option>
        <option>National Level</option>
      </select>
    </div>
    <div style="display:flex; gap:12px;">
      <button onclick="saveEdit()" style="flex:1; padding:13px; background:linear-gradient(135deg,#00ff44,#00cc36); border:none; border-radius:10px; color:#0a0a0f; font-family:'Bebas Neue',cursive; font-size:18px; letter-spacing:2px; cursor:pointer;">SAVE CHANGES</button>
      <button onclick="closeEdit()" style="flex:1; padding:13px; background:transparent; border:2px solid #556; border-radius:10px; color:#556; font-family:'Bebas Neue',cursive; font-size:18px; letter-spacing:2px; cursor:pointer;">CANCEL</button>
    </div>
  </div>
</div>

<div class="card no-user" id="noUser" style="display:none">
  <h2>Not Logged In</h2>
  <p>Please <a href="login.html">login</a> or <a href="signup.html">sign up</a> first.</p>
</div>

<script>
const user = JSON.parse(localStorage.getItem("sportifyUser"));
if (user) {
  document.getElementById("profileCard").style.display = "block";
  document.getElementById("pName").textContent = user.fname + " " + user.lname;
  document.getElementById("pLevel").textContent = "🏅 " + (user.sports || "Athlete");
  document.getElementById("pAge").textContent = user.age + " years";
  document.getElementById("pEmail").textContent = user.email;
  document.getElementById("pPhone").textContent = user.phone;
  document.getElementById("pSports").textContent = user.sports;
} else {
  document.getElementById("noUser").style.display = "block";
}
function openEdit() {
  const user = JSON.parse(localStorage.getItem("sportifyUser"));
  if (!user) return;
  document.getElementById("eFname").value = user.fname || "";
  document.getElementById("eLname").value = user.lname || "";
  document.getElementById("ePhone").value = user.phone || "";
  document.getElementById("eSports").value = user.sports || "";
  document.getElementById("editError").textContent = "";
  const modal = document.getElementById("editModal");
  modal.style.display = "flex";
}
function closeEdit() {
  document.getElementById("editModal").style.display = "none";
}
function saveEdit() {
  const fname = document.getElementById("eFname").value.trim();
  const lname = document.getElementById("eLname").value.trim();
  const phone = document.getElementById("ePhone").value.trim();
  const sports = document.getElementById("eSports").value;
  const err = document.getElementById("editError");
  err.textContent = "";
  if (!fname || !lname) { err.textContent = "First and Last name are required."; return; }
  if (phone.replace(/\D/g,'').length < 10) { err.textContent = "Enter a valid phone number."; return; }
  if (!sports) { err.textContent = "Please select a sports level."; return; }
  const user = JSON.parse(localStorage.getItem("sportifyUser"));
  const updated = { ...user, fname, lname, phone, sports };
  localStorage.setItem("sportifyUser", JSON.stringify(updated));
  // Refresh displayed info
  document.getElementById("pName").textContent = fname + " " + lname;
  document.getElementById("pLevel").textContent = "🏅 " + sports;
  document.getElementById("pPhone").textContent = phone;
  document.getElementById("pSports").textContent = sports;
  closeEdit();
}
function logout() {
  localStorage.removeItem("sportifyUser");
  window.location.href = "login.html";
}
</script>
</body>
</html>
