<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sportify - Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Rajdhani', sans-serif;
  background: #0a0a0f;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 20px;
}

.bg-grid {
  position: fixed; inset: 0;
  background-image: linear-gradient(rgba(0,255,68,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,68,0.04) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

.card {
  background: linear-gradient(135deg, #0d1a0d 0%, #0a0a0f 100%);
  border: 1px solid #1a3a1a;
  border-radius: 20px;
  padding: 40px;
  width: 100%; max-width: 700px;
  box-shadow: 0 0 60px rgba(0,255,68,0.1);
  position: relative; z-index: 1;
  animation: fadeIn 0.5s ease both;
}
@keyframes fadeIn { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: none; } }

.banner {
  display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;
  background: rgba(0,255,68,0.07);
  border: 1px solid #1a3a1a;
  border-radius: 12px;
  padding: 14px;
  font-size: 28px;
  margin-bottom: 24px;
}

.card-title { text-align: center; margin-bottom: 24px; }
.card-title h2 { font-family: 'Bebas Neue', cursive; font-size: 36px; color: #00ff44; letter-spacing: 3px; }
.card-title p { color: #556; font-size: 13px; letter-spacing: 1px; }

.error { color: #ff4444; font-size: 13px; font-weight: 700; text-align: center; margin-bottom: 12px; min-height: 18px; }

.row { display: flex; gap: 16px; }
.row .field { flex: 1; }

.field { margin-bottom: 16px; }
.field label { display: block; color: #00ff44; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 7px; }
.field input, .field select {
  width: 100%;
  background: #0d1a0d;
  border: 1px solid #1a3a1a;
  color: #eee;
  padding: 12px 16px;
  border-radius: 10px;
  font-family: 'Rajdhani', sans-serif;
  font-size: 15px; font-weight: 600;
  outline: none; transition: all 0.3s;
}
.field input:focus, .field select:focus { border-color: #00ff44; box-shadow: 0 0 12px rgba(0,255,68,0.12); }
.field input::placeholder { color: #334; }
.field select option { background: #0d1a0d; }

.gender-opts { display: flex; gap: 24px; padding-top: 4px; }
.gender-opts label { display: flex; align-items: center; gap: 8px; cursor: pointer; color: #aaa; font-weight: 600; font-size: 15px; }
.gender-opts input[type=radio] { accent-color: #00ff44; width: 16px; height: 16px; }

hr { border: none; border-top: 1px solid #1a3a1a; margin: 24px 0; }

.captcha-row { display: flex; gap: 10px; align-items: center; }
.captcha-display {
  background: #0d1a0d; border: 1px solid #00ff44;
  color: #00ff44; padding: 12px 16px;
  border-radius: 10px;
  font-family: 'Bebas Neue', cursive; font-size: 20px; letter-spacing: 4px;
  min-width: 100px; text-align: center; user-select: none;
}
.refresh-btn {
  background: rgba(0,255,68,0.1); border: 1px solid #00ff44; color: #00ff44;
  width: 44px; height: 44px; border-radius: 10px; font-size: 18px; cursor: pointer; transition: all 0.3s; flex-shrink: 0;
}
.refresh-btn:hover { background: #00ff44; color: #0a0a0f; transform: rotate(180deg); }

.submit-btn {
  width: 100%; padding: 15px;
  background: linear-gradient(135deg, #00ff44, #00cc36);
  border: none; border-radius: 10px;
  color: #0a0a0f;
  font-family: 'Bebas Neue', cursive; font-size: 20px; letter-spacing: 3px;
  cursor: pointer; transition: all 0.3s; margin-top: 8px;
}
.submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,255,68,0.4); }

.login-link { text-align: center; margin-top: 18px; color: #556; font-size: 14px; }
.login-link a { color: #00ff44; text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
<!-- SPORTIFY NAV START -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style id="sportify-nav-css">

/* ===== SPORTIFY NAVBAR ===== */

  position: fixed; top: 0; left: 0; right: 0; height: 70px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px;
  background: linear-gradient(135deg, #0a0a0f 0%, #0d1f0d 100%);
  border-bottom: 2px solid #00ff44;
  box-shadow: 0 4px 30px rgba(0,255,68,0.15);
  z-index: 99999;
  font-family: 'Rajdhani', sans-serif;
}
#sportify-nav .nav-left { display: flex; align-items: center; gap: 16px; }
#sportify-nav #ham {
  background: none; border: 2px solid #00ff44; color: #00ff44;
  font-size: 20px; width: 42px; height: 42px; border-radius: 8px;
  cursor: pointer; transition: all 0.3s;
  display: flex; align-items: center; justify-content: center;
}
#sportify-nav #ham:hover { background: #00ff44; color: #0a0a0f; }
#sportify-nav .logo {
  font-family: 'Bebas Neue', cursive; font-size: 32px; color: #00ff44;
  letter-spacing: 3px; text-shadow: 0 0 20px rgba(0,255,68,0.5); cursor: pointer;
}
#sportify-nav .logo span { color: #fff; }
#sportify-nav .nav-links { display: flex; align-items: center; gap: 6px; list-style: none; }
#sportify-nav .nav-links li {
  color: #aaa; font-size: 13px; font-weight: 600; letter-spacing: 1.5px;
  padding: 8px 14px; border-radius: 6px; cursor: pointer;
  transition: all 0.3s; text-transform: uppercase; white-space: nowrap;
}
#sportify-nav .nav-links li:hover { color: #00ff44; background: rgba(0,255,68,0.08); }
#sportify-nav #loginBtn {
  background: #00ff44; color: #0a0a0f; border: none; padding: 9px 20px;
  border-radius: 6px; font-family: 'Rajdhani', sans-serif; font-weight: 700;
  font-size: 13px; letter-spacing: 1.5px; cursor: pointer; transition: all 0.3s; text-transform: uppercase;
}
#sportify-nav #loginBtn:hover { background: #00cc36; box-shadow: 0 0 20px rgba(0,255,68,0.4); }
#sportify-nav #profileBtn {
  background: rgba(0,255,68,0.1); border: 2px solid #00ff44; color: #00ff44;
  width: 38px; height: 38px; border-radius: 50%; font-size: 18px;
  cursor: pointer; transition: all 0.3s;
}
#sportify-nav #profileBtn:hover { background: #00ff44; color: #0a0a0f; }
#sideMenu {
  position: fixed; top: 70px; left: -320px; width: 280px;
  height: calc(100vh - 70px); background: #0d0d12;
  border-right: 2px solid #00ff44; box-shadow: 6px 0 40px rgba(0,255,68,0.2);
  transition: left 0.4s cubic-bezier(0.4,0,0.2,1); z-index: 99998;
  overflow-y: auto; padding-bottom: 30px;
}
#sideMenu.open { left: 0; }
.menu-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 20px; border-bottom: 1px solid #1a2a1a; margin-bottom: 10px;
}
.menu-title { font-family: 'Bebas Neue', cursive; color: #00ff44; font-size: 20px; letter-spacing: 2px; }
#closeBtn { background: none; border: none; color: #ff4444; font-size: 22px; cursor: pointer; transition: transform 0.3s; }
#closeBtn:hover { transform: rotate(90deg); }
.cat-item {
  display: flex; align-items: center; gap: 16px;
  padding: 18px 22px; cursor: pointer; transition: all 0.25s;
  border-left: 3px solid transparent; margin: 2px 0;
}
.cat-item:hover { background: rgba(0,255,68,0.07); border-left-color: #00ff44; }
.cat-icon { font-size: 28px; width: 36px; text-align: center; flex-shrink: 0; }
.cat-name { font-family: 'Bebas Neue', cursive; font-size: 18px; letter-spacing: 2px; color: #ddd; display: block; }
.cat-item:hover .cat-name { color: #00ff44; }
.menu-divider { border: none; border-top: 1px solid #1a2a1a; margin: 6px 0; }
#nav-overlay {
  display: none; position: fixed; top: 70px; left: 0;
  width: 100%; height: 100%; background: rgba(0,0,0,0.55); z-index: 9998;
}
#nav-overlay.show { display: block; }
body { padding-top: 100px !important; }

</style>
<nav id="sportify-nav">
  <div class="nav-left">
    <button id="ham" onclick="navToggleMenu()">☰</button>
    <div class="logo" onclick="navGoTo('sportshome.html')">SPORT<span>IFY</span></div>
  </div>
  <ul class="nav-links">
    <li onclick="navGoTo('sportshome.html')">🏠 Home</li>
    <li onclick="navGoTo('about.html')">About Us</li>
    <li onclick="navGoTo('contact.html')">Contact</li>
    <li><button id="loginBtn" onclick="navGoTo('login.html')">Login</button></li>
    <li><button id="profileBtn" onclick="navGoTo('profile.html')">👤</button></li>
  </ul>
</nav>
<div id="nav-overlay" onclick="navCloseMenu()"></div>
<div id="sideMenu">
  <div class="menu-header">
    <span class="menu-title">🏆 SPORTS</span>
    <button id="closeBtn" onclick="navCloseMenu()">✕</button>
  </div>
  <div class="cat-item" onclick="navGoTo('indoor.html')"><span class="cat-icon">🏓</span><span class="cat-name">INDOOR SPORTS</span></div>
  <hr class="menu-divider">
  <div class="cat-item" onclick="navGoTo('outdoor.html')"><span class="cat-icon">⚽</span><span class="cat-name">OUTDOOR SPORTS</span></div>
  <hr class="menu-divider">
  <div class="cat-item" onclick="navGoTo('board.html')"><span class="cat-icon">♟</span><span class="cat-name">BOARD GAMES</span></div>
  <hr class="menu-divider">
  <div class="cat-item" onclick="navGoTo('athletics.html')"><span class="cat-icon">🏃</span><span class="cat-name">ATHLETICS</span></div>
  <hr class="menu-divider">
  <div class="cat-item" onclick="navGoTo('esports.html')"><span class="cat-icon">🎮</span><span class="cat-name">E-SPORTS</span></div>
</div>
<script>
function navToggleMenu(){document.getElementById('sideMenu').classList.toggle('open');document.getElementById('nav-overlay').classList.toggle('show');}
function navCloseMenu(){document.getElementById('sideMenu').classList.remove('open');document.getElementById('nav-overlay').classList.remove('show');}
function navGoTo(page){navCloseMenu();window.location.href=page;}
function navGoBack(){window.history.back();}
</script>
<!-- SPORTIFY NAV END -->
<div class="bg-grid"></div>

<div class="card">
  <div class="banner">⚽ 🏀 🏏 🎾 🏊 🏃 🚴 🥊 🏋️ 🤸</div>

  <div class="card-title">
    <h2>SIGN UP FREE</h2>
    <p>JOIN THOUSANDS OF ATHLETES ON SPORTIFY</p>
  </div>

  <div id="errorMsg" class="error"></div>

  <div class="row">
    <div class="field"><label>First Name</label><input type="text" id="fname" placeholder="First name"></div>
    <div class="field"><label>Last Name</label><input type="text" id="lname" placeholder="Last name"></div>
  </div>

  <div class="row">
    <div class="field"><label>Date of Birth</label><input type="date" id="dob" onchange="calcAge()"></div>
    <div class="field"><label>Age</label><input type="number" id="age" placeholder="Auto-calculated"></div>
  </div>

  <div class="field"><label>Email Address</label><input type="email" id="email" placeholder="athlete@example.com"></div>
  <div class="field"><label>Phone Number</label><input type="tel" id="phone" placeholder="+91 XXXXX XXXXX"></div>

  <div class="field">
    <label>Gender</label>
    <div class="gender-opts">
      <label><input type="radio" name="gender" value="Male"> Male</label>
      <label><input type="radio" name="gender" value="Female"> Female</label>
    </div>
  </div>

  <div class="field">
    <label>Sports Level</label>
    <select id="sports">
      <option value="">Select your level</option>
      <option>Beginner</option>
      <option>Intermediate</option>
      <option>State Level</option>
      <option>National Level</option>
    </select>
  </div>

  <hr>

  <div class="row">
    <div class="field"><label>Password</label><input type="password" id="password" placeholder="Min. 6 characters"></div>
    <div class="field"><label>Confirm Password</label><input type="password" id="confirmPassword" placeholder="Repeat password"></div>
  </div>

  <div class="field">
    <label>CAPTCHA Verification</label>
    <div class="captcha-row">
      <div class="captcha-display" id="captcha"></div>
      <button class="refresh-btn" onclick="generateCaptcha()" title="Refresh">↺</button>
      <input type="text" id="captchaInput" placeholder="Enter CAPTCHA" style="flex:1;">
    </div>
  </div>

  <button class="submit-btn" onclick="submitForm()">CREATE ACCOUNT 🚀</button>

  <div class="login-link">Already have an account? <a href="login.html">Login here</a></div>
</div>

<script>
let currentCaptcha = "";
function generateCaptcha() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  currentCaptcha = Array.from({length: 6}, () => chars[Math.floor(Math.random() * chars.length)]).join('');
  document.getElementById("captcha").textContent = currentCaptcha;
}
generateCaptcha();

function calcAge() {
  const dob = new Date(document.getElementById("dob").value);
  const age = new Date().getFullYear() - dob.getFullYear();
  document.getElementById("age").value = age;
}

function submitForm() {
  const err = document.getElementById("errorMsg");
  const fname = document.getElementById("fname").value.trim();
  const lname = document.getElementById("lname").value.trim();
  const age = document.getElementById("age").value;
  const email = document.getElementById("email").value;
  const phone = document.getElementById("phone").value;
  const sports = document.getElementById("sports").value;
  const pass = document.getElementById("password").value;
  const confirm = document.getElementById("confirmPassword").value;
  const captcha = document.getElementById("captchaInput").value.toUpperCase();

  err.textContent = "";
  if (!fname || !lname) { err.textContent = "Enter your full name."; return; }
  if (age < 10 || age > 60) { err.textContent = "Age must be between 10 and 60."; return; }
  if (!email.includes("@")) { err.textContent = "Invalid email address."; return; }
  if (phone.replace(/\D/g,'').length < 10) { err.textContent = "Enter a valid phone number."; return; }
  if (!sports) { err.textContent = "Please select your sports level."; return; }
  if (pass.length < 6) { err.textContent = "Password must be at least 6 characters."; return; }
  if (pass !== confirm) { err.textContent = "Passwords do not match."; return; }
  if (captcha !== currentCaptcha) { err.textContent = "Wrong CAPTCHA — please try again."; generateCaptcha(); return; }

  localStorage.setItem("sportifyUser", JSON.stringify({ fname, lname, age, email, phone, sports }));
  window.location.href = "login.html";
}
</script>
</body>
</html>
